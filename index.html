<!DOCTYPE html>
<!--
  ════════════════════════════════════════════════════════════════════════════
  SIMULADOR AC MÓVIL · PREVENTA — Proyecto PA1 (equipo Zebra)
  ════════════════════════════════════════════════════════════════════════════
  Archivo único y autocontenido: HTML + CSS + JavaScript, sin dependencias.
  Practica el flujo de preventa real: login → sincronizar → clientes →
  pedido → enviar, y muestra qué ocurre después de Enviar (CDA, facturas
  de SAP, orden de reparto y carga del camión). Incluye la suite de 27
  pruebas de calidad embebida (botón "Ejecutar pruebas de calidad").

  ── MAPA DEL CÓDIGO ────────────────────────────────────────────────────────

    CSS   → 16 bloques temáticos, en el mismo orden en que se pintan:
            1 tema/variables · 2 reset · 3 página · 4 teléfono · 5 barra
            de estado · 6 pantalla · 7 mosaicos · 8 pie · 9 listas ·
            10 formularios · 11 botón de acción · 12 diálogos · 13 tablas ·
            14 paginación/mensajes · 15 guía · 16 post-Enviar y QA.
            Busca las marcas:   ── BLOQUE n ──

    HTML  → 4 piezas contenedoras: el teléfono #scr (la app se dibuja
            aquí), la guía de práctica #gd, el panel post-Enviar #cda
            y el panel de resultados de pruebas #qa.

    JS    → 14 secciones numeradas:
             S1  Utilidades            S8  Diálogos, render y navegación
             S2  Datos maestros        S9  Cálculos pedido+metas
             S3  Iconos SVG            S10 Panel post-Enviar (CDA)
             S4  Semilla de demo       S11 Suite de pruebas QA (23)
             S5  Estado y arranque     S12 Registro de comunicación
             S6  Ayudas de render      S13 Acciones del usuario
             S7  Vistas (pantallas)    S14 Delegación de clics
            Busca las marcas:   ═══ SECCIÓN n: … ═══
  ════════════════════════════════════════════════════════════════════════════
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Simulador AC Móvil – Preventa</title>

  <style>
  /* ═══════════════════════════════════════════════════════════════════
     BLOQUE 1: TEMA — VARIABLES DE COLOR (modo claro y oscuro)
     ═══════════════════════════════════════════════════════════════════ */

  :root {
    /* Paleta del modo claro */
    --bg: #faf8f6;
    --card: #fff;
    --tx: #1c1b1a;
    --mu: #6b6761;
    --ac: #c8102e;
    --bd: #e6e1db;

    /* Ajustes globales de la raíz (pantallas con notch y modo de color) */
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }

  /* Oscuro automático: si el sistema usa modo oscuro y el usuario
     no ha forzado el claro con data-theme="light" */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161514;
      --card: #201f1d;
      --tx: #f1eeea;
      --mu: #a29d95;
      --ac: #ff5a6e;
      --bd: #37342f;
      color-scheme: dark;
    }
  }

  /* Oscuro forzado con data-theme="dark" */
  :root[data-theme="dark"] {
    --bg: #161514;
    --card: #201f1d;
    --tx: #f1eeea;
    --mu: #a29d95;
    --ac: #ff5a6e;
    --bd: #37342f;
    color-scheme: dark;
  }

  /* ═══════════════════════════════════════════════════════════════════
     BLOQUE 2: RESET Y ESTILOS BASE
     ═══════════════════════════════════════════════════════════════════ */

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--tx);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* ═══════════════════════════════════════════════════════════════════
     BLOQUE 3: PÁGINA — CABECERA Y DISPOSICIÓN GENERAL
     ═══════════════════════════════════════════════════════════════════ */

  h1 {
    margin: 0;
    font-size: clamp(22px, 4vw, 30px);
    color: var(--ac);
  }

  header {
    max-width: 980px;
    margin: auto;
    padding: 22px 16px 6px;
  }

  header p {
    margin: 4px 0 0;
    color: var(--mu);
  }

  /* Contenedor: teléfono + guía + paneles, centrados y envolventes */
  .wrap {
    max-width: 980px;
    margin: auto;
    padding: 12px 16px 40px;
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
  }

  /* ═══════════════════════════════════════════════════════════════════
     BLOQUE 4: TELÉFONO ZEBRA (marco simulado del equipo)
     ═══════════════════════════════════════════════════════════════════ */

  .ph {
    width: 340px;
    height: 700px;
    background: #15171a;
    border-radius: 30px;
    padding: 50px 11px 46px;
    position: relative;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    flex: none;
    border: 2px solid #2b2e33;
  }

  /* Marca "ZEBRA" grabada arriba del marco */
  .ph:before {
    content: "ZEBRA";
    position: absolute;
    top: 18px;
    left: 0;
    right: 0;
    text-align: center;
    color: #e8e8e8;
    font: 700 16px Arial;
    letter-spacing: 1px;
  }

  /* Botones de navegación del equipo (atrás · inicio · recientes) */
  .nv {
    position: absolute;
    bottom: 10px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-around;
    color: #777;
    font-size: 16px;
  }

  .nv span {
    cursor: pointer;
    padding: 0 20px;
  }

  /* Pantalla del equipo: aquí la app se dibuja por completo */
  #scr {
    height: 100%;
    background: #000;
    color: #eee;
    position: relative;
    overflow: hidden;
    font: 13px/1.3 Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    border-radius: 3px;
  }

  /* ═══════════════════════════════════════════════════════════════════
     BLOQUE 5: BARRA DE ESTADO (hora · señal · batería)
     ═══════════════════════════════════════════════════════════════════ */

  .sb {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    padding: 2px 6px;
    color: #ddd;
  }

  /* ═══════════════════════════════════════════════════════════════════
     BLOQUE 6: CABECERA Y CUERPO DE CADA PANTALLA
     ═══════════════════════════════════════════════════════════════════ */

  .hd {
    background: #cfd2da;
    color: #111;
    padding: 6px 8px;
    display: flex;
    gap: 8px;
    align-items: center;
    margin: 0 4px;
  }

  .hd i {
    color: #c8102e;
    font-style: normal;
    font-size: 20px;
  }

  .hd b {
    display: block;
    font-size: 15px;
    font-weight: 500;
  }

  .hd small {
    font-size: 12px;
  }

  /* Cuerpo desplazable de la pantalla */
  .bd {
    flex: 1;
    overflow: auto;
    padding: 5px 4px;
  }

  /* ═══════════════════════════════════════════════════════════════════
     BLOQUE 7: MENÚ DE MOSAICOS (cuadrícula de 4 columnas)
     ═══════════════════════════════════════════════════════════════════ */

  .gm {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 64px;
    gap: 5px;
    grid-auto-flow: dense;
  }

  /* Cuadrícula de 2 columnas (pantallas secundarias) */
  .g2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: 84px;
    gap: 6px;
  }

  /* Mosaico base */
  .t {
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 9.5px;
    font-weight: 600;
    color: #111;
    background: linear-gradient(#e3e5ea, #a5abb8);
    cursor: pointer;
    padding: 2px;
    line-height: 1.15;
  }

  .t b {
    font-size: 17px;
    font-weight: 700;
  }

  .t em {
    font-style: normal;
    font-size: 20px;
  }

  /* Variantes de color: rojo y verde */
  .r {
    background: linear-gradient(#ec3a3a, #a30f0f);
    color: #fff;
  }

  .g {
    background: linear-gradient(#3cba3c, #087008);
    color: #fff;
  }

  /* Expansiones de la cuadrícula: ancho doble y alto doble */
  .w2 {
    grid-column: span 2;
  }

  .h2 {
    grid-row: span 2;
  }

  /* Donut del Score Card: dos colores (atendidas / por visitar). El porcentaje
     llega en la variable --p desde el menú y el número se escribe en el <span>. */
  .donut {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: conic-gradient(#3cba3c 0 var(--p, 0%), #6a6f7a var(--p, 0%) 100%);
    display: grid;
    place-items: center;
  }

  .donut span {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #c5c9d2;
    color: #111;
    font-size: 12px;
    font-weight: 700;
    display: grid;
    place-items: center;
  }

  /* Texto pequeño bajo el número de un mosaico */
  .t small {
    display: block;
    font-size: 8px;
    font-weight: 400;
    margin-top: 2px;
  }

  /* ═══════════════════════════════════════════════════════════════════
     BLOQUE 8: PIE DE PANTALLA (barra de iconos)
     ═══════════════════════════════════════════════════════════════════ */

  .ft {
    display: flex;
    justify-content: space-between;
    background: #cfd2da;
    color: #111;
    margin: 0 4px 4px;
    padding: 6px 8px;
    font-size: 20px;
  }

  .ft span {
    cursor: pointer;
  }

  .ft svg {
    display: block;
  }

  /* ═══════════════════════════════════════════════════════════════════
     BLOQUE 9: LISTAS — CLIENTES Y ESTADOS
             (✓ pedido · ⏳ pendiente · ✕ no pidió)
     ═══════════════════════════════════════════════════════════════════ */

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 4px;
    border-bottom: 1px solid #222;
    cursor: pointer;
    font-size: 12px;
  }

  .row:hover {
    background: #111;
  }

  /* Recuadro del estado (marca) */
  .mk {
    width: 26px;
    height: 26px;
    border: 1px solid #888;
    border-radius: 3px;
    display: grid;
    place-items: center;
    font-size: 20px;
    flex: none;
    background: #ddd;
    color: #333;
  }

  .mk.s {
    background: #e33;
    gap: 0;
  }

  .mk.o {
    background: #f90;
    color: #000;
    font-size: 12px;
  }

  .mk.k {
    background: #2b2;
    color: #000;
    font-size: 14px;
  }

  /* Barra resumen: programados · visitados · por visitar */
  .st {
    display: flex;
    justify-content: space-around;
    text-align: center;
    font-size: 11px;
    color: #ccc;
    padding: 4px 0;
  }

  .st b {
    display: block;
    font-size: 15px;
    color: #fff;
  }

  .row svg {
    color: #aaa;
    flex: none;
  }

  /* ═══════════════════════════════════════════════════════════════════
     BLOQUE 10: FORMULARIOS — CAMPOS, RADIOS Y ADJUNTOS
     ═══════════════════════════════════════════════════════════════════ */

  /* Opción tipo radio (motivos) */
  .rad {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 9px 6px;
    font-size: 14px;
    cursor: pointer;
  }

  .rad u {
    width: 18px;
    height: 18px;
    border: 2px solid #aaa;
    border-radius: 50%;
    display: block;
  }

  .rad.on u {
    background: radial-gradient(#fff 35%, #4a8 40%);
    border-color: #4a8;
  }

  /* Campo en línea: etiqueta a la izquierda, valor a la derecha */
  .fld {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 6px;
    gap: 8px;
  }

  .fld input {
    width: 96px;
    background: #111;
    border: 1px solid #556;
    color: #fff;
    padding: 6px;
    border-radius: 3px;
    font-size: 15px;
    text-align: right;
  }

  /* Campo apilado (alta de cliente) */
  .fa {
    padding: 4px 6px;
  }

  .fa span {
    display: block;
    font-size: 11px;
    color: #aab;
  }

  .fa input {
    width: 100%;
    background: #111;
    border: 1px solid #556;
    color: #fff;
    padding: 7px;
    border-radius: 3px;
    font-size: 14px;
  }

  /* Botón pastilla para adjuntar documentos */
  .att {
    background: #334;
    color: #fff;
    border-radius: 12px;
    padding: 4px 9px;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
  }

  /* ═══════════════════════════════════════════════════════════════════
     BLOQUE 11: BOTÓN GRANDE DE ACCIÓN
     ═══════════════════════════════════════════════════════════════════ */

  .big {
    background: #9aa1b3;
    color: #111;
    text-align: center;
    font-size: 22px;
    padding: 8px;
    margin: 6px 4px;
    cursor: pointer;
    border-radius: 3px;
  }

  /* ═══════════════════════════════════════════════════════════════════
     BLOQUE 12: DIÁLOGOS MODALES (promociones y confirmaciones)
     ═══════════════════════════════════════════════════════════════════ */

  /* Fondo oscurecido que cubre la pantalla */
  .ov {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, .6);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    z-index: 3;
  }

  /* Caja del diálogo */
  .dl {
    background: #c6d4e6;
    color: #111;
    width: 100%;
    font-size: 13px;
    padding: 12px;
    border-radius: 3px;
  }

  .dl h4 {
    margin: 0 0 8px;
    font-size: 17px;
    font-weight: 500;
  }

  .dl .it {
    padding: 8px 4px;
    cursor: pointer;
    font-size: 12px;
  }

  .dl .it.on {
    font-weight: 700;
  }

  .dl .bt {
    display: flex;
    justify-content: flex-end;
    gap: 14px;
    margin-top: 10px;
    font-weight: 700;
    flex-wrap: wrap;
  }

  .bt span {
    cursor: pointer;
    padding: 4px 2px;
  }

  /* ═══════════════════════════════════════════════════════════════════
     BLOQUE 13: TABLAS DEL PEDIDO Y TOTALES
             (SKU · cajas · botellas · importe)
     ═══════════════════════════════════════════════════════════════════ */

  /* Barra de herramientas sobre la tabla del pedido */
  .tb {
    display: flex;
    justify-content: space-between;
    background: #cfd2da;
    color: #111;
    margin: 0 4px;
    padding: 6px 10px;
    font-size: 19px;
  }

  .tb span {
    cursor: pointer;
  }

  /* Recuadro de totales (cajas · botellas · subtotal · IGV · total) */
  .tot {
    background: #bcdcec;
    color: #111;
    margin: 4px;
    padding: 6px 8px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px 14px;
    font-size: 11.5px;
  }

  .tot div {
    display: flex;
    justify-content: space-between;
  }

  /* Tabla genérica (CDA / facturas / reparto) */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11.5px;
    color: #ddd;
  }

  th {
    text-align: left;
    font-weight: 500;
    color: #aab;
    padding: 4px 2px;
  }

  td {
    padding: 4px 2px;
    border-top: 1px solid #222;
  }

  /* Tabla compacta "lv" del levantamiento de pedido */
  .lv {
    table-layout: fixed;
  }

  .lv td {
    padding: 2px 1px;
    font-size: 9.5px;
    vertical-align: middle;
    line-height: 1.1;
  }

  .lv th {
    font-size: 9.5px;
    padding: 3px 1px;
  }

  .lv input {
    width: 100%;
    background: #111;
    border: 1px solid #556;
    color: #fff;
    padding: 5px 1px;
    font-size: 11.5px;
    border-radius: 2px;
    text-align: center;
  }

  .lv .x {
    color: #f77;
    cursor: pointer;
    text-align: center;
  }

  .lv select {
    width: 100%;
    background: #111;
    color: #fff;
    border: 1px solid #556;
    font-size: 9px;
    padding: 5px 0;
    border-radius: 2px;
  }

  /* ═══════════════════════════════════════════════════════════════════
     BLOQUE 14: PAGINACIÓN POR PUNTOS Y MENSAJES (log · ok · toast)
     ═══════════════════════════════════════════════════════════════════ */

  /* Puntos que cambian de página en el pedido */
  .dots {
    text-align: center;
    padding: 3px;
  }

  .dots span {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 1px solid #aaa;
    margin: 0 3px;
    cursor: pointer;
  }

  .dots span.on {
    background: #ddd;
  }

  /* Líneas del registro de comunicación */
  .lg {
    color: #2e2;
    padding: 3px 10px;
    font-size: 12.5px;
  }

  /* Aviso grande "COMUNICACIÓN EFECTUADA CORRECTAMENTE" */
  .ok {
    color: #2e2;
    text-align: center;
    padding: 30px 10px 6px;
    font-weight: 600;
    font-size: 13px;
  }

  /* Mensaje flotante inferior */
  .toast {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 46px;
    background: #ddd;
    color: #111;
    padding: 9px 11px;
    border-radius: 18px;
    font-size: 12.5px;
    z-index: 5;
    text-align: center;
  }

  /* ═══════════════════════════════════════════════════════════════════
     BLOQUE 15: GUÍA DE PRÁCTICA (panel derecho)
     ═══════════════════════════════════════════════════════════════════ */

  .gd {
    flex: 1;
    min-width: 280px;
    max-width: 520px;
    background: var(--card);
    border: 1px solid var(--bd);
    border-radius: 16px;
    padding: 18px;
  }

  .gd h3 {
    margin: 0 0 4px;
    font-size: 18px;
  }

  .gd p {
    margin: 6px 0;
  }

  /* Recuadro de consejo (tiempo del último pedido) */
  .tip {
    background: var(--bg);
    border-left: 3px solid var(--ac);
    padding: 8px 10px;
    border-radius: 6px;
    color: var(--mu);
    font-size: 14px;
  }

  /* Lista de pasos del flujo */
  .gd ol {
    padding-left: 0;
    list-style: none;
    margin: 14px 0;
  }

  .gd li {
    display: flex;
    gap: 10px;
    padding: 5px 8px;
    border-radius: 8px;
    color: var(--mu);
    font-size: 14px;
  }

  /* Número de paso dentro de un círculo */
  .gd li b {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid var(--bd);
    display: grid;
    place-items: center;
    font-size: 12px;
    flex: none;
  }

  /* Paso actual (resaltado) y paso completado (verde) */
  .gd li.on {
    background: var(--bg);
    color: var(--tx);
    font-weight: 600;
  }

  .gd li.on b {
    background: var(--ac);
    color: #fff;
    border-color: var(--ac);
  }

  .gd li.d b {
    background: #2a8a3a;
    color: #fff;
    border-color: #2a8a3a;
  }

  /* Botones redondeados de la guía (pruebas · cobertura · reinicio) */
  button.rs {
    background: none;
    border: 1px solid var(--bd);
    color: var(--tx);
    padding: 7px 14px;
    border-radius: 99px;
    cursor: pointer;
    font-size: 14px;
  }

  button.rs:hover {
    border-color: var(--ac);
  }

  /* ═══════════════════════════════════════════════════════════════════
     BLOQUE 16: PANEL POST-ENVIAR (CDA) Y PRUEBAS QA
     ═══════════════════════════════════════════════════════════════════ */

  /* Panel ancho compartido por #cda y #qa (oculto hasta que se usa) */
  .cda {
    flex: 1 1 100%;
    max-width: 940px;
    background: var(--card);
    border: 1px solid var(--bd);
    border-radius: 16px;
    padding: 18px;
    display: none;
  }

  .cda h3 {
    margin: 0 0 8px;
  }

  .cda h4 {
    margin: 16px 0 6px;
    font-size: 15px;
  }

  /* Tubería de nodos: equipo → middleware → CDA → SAP → logística */
  .pipe {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .nd {
    padding: 8px 10px;
    border: 1px solid var(--bd);
    border-radius: 10px;
    opacity: .35;
    transition: .4s;
    font-size: 13px;
    text-align: center;
    flex: 1;
    min-width: 110px;
  }

  .nd.on {
    opacity: 1;
    border-color: var(--ac);
    background: var(--bg);
  }

  .ar {
    opacity: .5;
  }

  /* Tablas dentro del panel (con desplazamiento horizontal) */
  .cda table {
    display: block;
    overflow-x: auto;
    width: 100%;
    border-collapse: collapse;

          <b>Detalle:</b>
          <div style="font-size:12px;margin-top:4px">${PR[S.psel][1]}</div>
          <div class="bt">
            <span data-a="close">CERRAR</span>
          </div>
        </div>
      </div>`;

    // Diálogo genérico: título, cuerpo y botones [texto, acción]
    return `
      <div class="ov">
        <div class="dl">
          <h4>${d.t}</h4>
          ${d.b}
          <div class="bt">
            ${(d.btn || []).map(b => `<span data-a="${b[1]}">${b[0]}</span>`).join('')}
          </div>
        </div>
      </div>`;
  }

  // Clave de la guía según la pantalla (y el diálogo) visibles
  function key() {
    const d = S.dlg;
    if (d) return d.k === 'promo' ? 'promo' : d.k === 'scan' ? 'scan' : 'conf';
    if (S.scr === 'ped') return S.pg ? 'lev' : 'ped0';
    return S.scr;
  }

  // Pinta la pantalla del equipo (#scr) y la guía de práctica (#gd)
  function render() {
    $('#scr').innerHTML = `
      <div class="sb">
        <span>${tm()}</span>
        <span>${S.off ? '🔑 📍 ✕ Sin señal 🔋' : '🔑 📍 4G ▂▄▆ 🔋'}</span>
      </div>
      ${V[S.scr]()}
      ${dlg()}
      ${S.toast ? `<div class="toast">${S.toast}</div>` : ''}`;

    // Guía: título y explicación del paso, flujo con pasos hechos/actual
    const g = G[key()],
          cur = g[2];
    $('#gd').innerHTML = `
      <h3>${g[0]}</h3>
      <p>${g[1]}</p>
      <ol>
        ${FLOW.map((f, i) => `<li class="${i === cur ? 'on' : i < cur ? 'd' : ''}"><b>${i < cur ? '✓' : i + 1}</b>${f}</li>`).join('')}
      </ol>
      ${S.lastT ? `<p class="tip">⏱️ Último pedido: ${S.lastT.toFixed(0)} s (meta del PA1: ≤ 90 s) ${S.lastT <= 90 ? '✓' : '✗'}</p>` : ''}
      <button class="rs" data-a="qa">Ejecutar pruebas de calidad</button>
      <button class="rs" data-a="off">${S.off ? 'Recuperar internet' : 'Simular zona sin cobertura'}</button>
      <button class="rs" data-a="reset">Reiniciar práctica</button>`;
  }

  // Navega a una pantalla guardando el historial (botón atrás)
  function go(s) {
    S.h.push(S.scr);
    S.scr = s;
    render();
  }

  // Muestra un mensaje flotante 2.6 s y repinta
  function toast(m) {
    S.toast = m;
    render();
    clearTimeout(S.tt);
    S.tt = setTimeout(() => { S.toast = null; render(); }, 2600);
  }

  /* ══════════════════════════════════════════════════════════════════════
     SECCIÓN 9: CÁLCULOS DEL PEDIDO Y EDICIÓN DE TABLAS
     ══════════════════════════════════════════════════════════════════════ */

  // Recuadro de totales del cambio de producto: cajas y botellas
  const ctot = L => {
    let c = 0, b = 0;
    L.forEach(r => {
      if (CAT[r.k]) {
        c += +r.c || 0;
        b += +r.b || 0;
      }
    });
    return `<div class="tot">
      <div><span>Cajas:</span><b id="xc">${c}</b></div>
      <div><span>Botellas:</span><b id="xb">${b}</b></div>
    </div>`;
  };

  // Edición de una fila del cambio de producto (SKU, cajas, botellas, motivo)
  function crin(i) {
    ['k', 'c', 'b'].forEach(x => {
      const e = $('#c' + x + i);
      e.value = e.value.replace(/\D/g, '');
    });
    const r = S.cr[i];
    r.k = $('#ck' + i).value;
    r.c = $('#cc' + i).value;
    r.b = $('#cb' + i).value;
    r.m = $('#cm' + i).value;

    // Descripción automática según el SKU
    const p = CAT[r.k];
    $('#cd' + i).innerHTML = p ? p[0] : (r.k ? '<span style="color:#f66">No existe</span>' : '');

    // Recalcula los totales del cambio
    let c = 0, b = 0;
    S.cr.forEach(x => {
      if (CAT[x.k]) {
        c += +x.c || 0;
        b += +x.b || 0;
      }
    });
    $('#xc').textContent = c;
    $('#xb').textContent = b;
  }

  // Importe de una fila: cajas × precio + botellas × precio unitario
  const rowImp = r => { const p = CAT[r.k]; return p ? (+r.c || 0) * p[1] + (+r.b || 0) * p[1] / p[2] : 0 };

  // Totales del pedido: con promoción (12 % si más de 2 cajas) e IGV 18 %
  const totR = R => {
    R = R || S.rows;
    let c = 0, b = 0, s = 0;
    R.forEach(r => {
      if (CAT[r.k]) {
        c += +r.c || 0;
        b += +r.b || 0;
        s += rowImp(r);
      }
    });
    const pr = c > 2 ? s * .12 : 0,
          ba = s - pr,
          ig = ba * .18;
    return { c, b, s, pr, ig, t: ba + ig };
  };

  // Recuadro de totales del pedido (subtotal, promoción, IGV y total)
  const tbx = T => `<div class="tot">
    <div><span>Cajas:</span><b id="tc">${T.c}</b></div>
    <div><span>Subtotal:</span><b id="ts">${fm(T.s)}</b></div>
    <div><span>Botellas:</span><b id="tb2">${T.b}</b></div>
    <div><span>Promoción:</span><b id="tp">-${fm(T.pr)}</b></div>
    <div></div>
    <div><span>IGV 18%:</span><b id="ti">${fm(T.ig)}</b></div>
    <div></div>
    <div><b>TOTAL:</b><b id="tt2" style="font-size:14px">${fm(T.t)}</b></div>
  </div>`;

  // Edición de una fila del pedido (SKU, cajas, botellas)
  function rin(i) {
    ['k', 'c', 'b'].forEach(x => {
      const e = $('#' + x + i);
      e.value = e.value.replace(/\D/g, '');
    });
    const r = S.rows[i];
    r.k = $('#k' + i).value;
    r.c = $('#c' + i).value;
    r.b = $('#b' + i).value;

    // Descripción, precio e importe automáticos
    const p = CAT[r.k];
    $('#d' + i).innerHTML = p ? p[0] : (r.k ? '<span style="color:#f66">No existe</span>' : '');
    $('#p' + i).textContent = p ? fm(p[1]) : '';
    $('#m' + i).textContent = p ? fm(rowImp(r)) : '';

    // Recalcula los totales del pedido
    const T = totR();
    $('#tc').textContent = T.c;
    $('#tb2').textContent = T.b;
    $('#ts').textContent = fm(T.s);
    $('#tp').textContent = '-' + fm(T.pr);
    $('#ti').textContent = fm(T.ig);
    $('#tt2').textContent = fm(T.t);
  }

  // Guarda un campo del formulario de alta de cliente
  function alt(k, v) { S.alta[k] = v }

  // Guarda el nombre del documento adjuntado y repinta
  function att(i, el) {
    S.alta.f[i] = el.files[0] ? el.files[0].name : '';
    render();
  }

  /* ══════════════════════════════════════════════════════════════════════
     SECCIÓN 9B: CUOTA, METAS Y RESÚMENES (litros, bodegas y saldos)
     Funciones de cálculo que alimentan el menú y las pantallas de resumen.
     ══════════════════════════════════════════════════════════════════════ */

  // Porcentaje entero de a sobre b (0 si b es 0)
  const pct = (a, b) => b > 0 ? Math.round(a / b * 100) : 0;

  // Formato de litros: 22140 → "22,140 L"
  const lt = n => Math.round(n).toLocaleString('en-US') + ' L';

  // Litros de una lista de filas [{k, c, b}]: (cajas × botellas por caja + botellas) × ml ÷ 1000
  const litrosDe = rows => rows.reduce((a, r) => {
    const p = CAT[r.k];
    return p ? a + ((+r.c || 0) * p[2] + (+r.b || 0)) * p[3] / 1000 : a;
  }, 0);

  // Litros por marca de una lista de clientes: { 'Coca-Cola': 27, ... }
  const marcasDe = list => {
    const o = {};
    list.forEach(c => c.ord.rows.forEach(r => {
      const p = CAT[r.k];
      if (p) o[p[4]] = (o[p[4]] || 0) + ((+r.c || 0) * p[2] + (+r.b || 0)) * p[3] / 1000;
    }));
    return o;
  };

  // Clientes con pedido hoy (enviado o pendiente de enviar)
  const conPedido = () => S.C.filter(c => c.ord && c.st >= 1);

  // Litros vendidos hoy
  const litrosHoy = () => conPedido().reduce((a, c) => a + litrosDe(c.ord.rows), 0);

  // Litros del mes = días anteriores (demo) + hoy
  const litrosMes = () => CFG.litrosPrevios + litrosHoy();

  // Porcentaje de la cuota mensual alcanzado
  const cuotaPct = () => pct(litrosMes(), CFG.cuotaMes);

  // Bodegas atendidas hoy (con pedido o sin pedido) y bodegas programadas
  const visitadas = () => S.C.filter(c => c.st !== 0).length;
  const programadas = () => CFG.visitasDia + S.extra;

  // Score diario: bodegas atendidas hoy ÷ programadas (solo bodegas, no litros)
  const scoreDia = () => pct(visitadas(), programadas());

  // Cumplimiento mensual: bodegas atendidas en el mes ÷ 984 visitas del mes
  const atendidasMes = () => CFG.visitasPrevias + visitadas();
  const cumplMes = () => pct(atendidasMes(), CFG.visitasMes);

  // Suma de los saldos (créditos) de todos los clientes
  const saldoTotal = () => S.C.reduce((a, c) => a + (c.saldo || 0), 0);

  // Barra de progreso para las pantallas de resumen
  const bar = p => `<div class="bar"><i style="width:${Math.min(100, p)}%"></i></div>`;

  // Fila de indicador con su barra
  const kpi = (et, val, p) => `<div class="kpi"><span>${et}</span><b>${val}</b></div>${p === undefined ? '' : bar(p)}`;

  /* ══════════════════════════════════════════════════════════════════════
     SECCIÓN 10: PANEL POST-ENVIAR: CDA → SAP → ORDEN DE REPARTO
     ══════════════════════════════════════════════════════════════════════ */

  // Muestra el panel "Qué pasa después de Enviar".
  // nw = nombres de clientes con pedido en esta transmisión
  // cam = cambios de producto enviados · al = altas de cliente enviadas

    el.style.display = 'block';

    // Cancela animaciones de un envío anterior
    cdaT.forEach(clearTimeout);
    cdaT = [];

    let f0 = S.fac || 97;
    S.C.forEach(c => {
      if (c.ord && !c.fac) c.fac = 'F001-' + String(++f0).padStart(6, '0');
    });
    S.fac = f0;

    // O = clientes que van en la factura y el reparto (visitados con pedido)
    // N = clientes de esta transmisión · prod = carga total por producto
    const hh = tm(),
          O = S.C.filter(c => c.ord && c.st === 2),
          N = S.C.filter(c => nw.includes(c.n)),
          prod = {};
    O.forEach(c => c.ord.rows.forEach(r => {
      const p = prod[r.k] = prod[r.k] || { c: 0, b: 0 };
      p.c += +r.c || 0;
      p.b += +r.b || 0;
    }));
    const tc = Object.values(prod).reduce((a, p) => a + p.c, 0),
          tb = Object.values(prod).reduce((a, p) => a + p.b, 0);

    // Detalle de productos de un cliente, una línea por SKU
    const det = c => c.ord.rows.map(r => CAT[r.k][0] + ' × ' + r.c + (r.b ? ' + ' + r.b + ' bot.' : '')).join('<br>');

    const NODES = ['📱 Equipo del vendedor', '🔀 Middleware API', '🏭 CDA (Centro de Distribución)', '🧾 SAP SD/MM + SUNAT', '🚚 Logística SAP LES/WM'],
          MSG = ['Transmitiendo datos…', 'Validando token y datos…', 'Llegaron al CDA a las ' + hh, 'SAP: pedidos registrados y facturas generadas', 'Orden de reparto lista para mañana'];

    el.innerHTML = `
      <h3>Qué pasa después de Enviar</h3>

        ${N.length ? `<table>
          <tr>
            <th>Cliente</th>
            <th>Productos</th>
            <th>Total</th>
          </tr>
          ${N.map(c => `<tr>
            <td>${c.n}</td>
            <td>${det(c)}</td>
            <td>${fm(totR(c.ord.rows).t)}</td>
          </tr>`).join('')}
        </table>` : '<p class="note">Esta transmisión no incluía pedidos nuevos.</p>'}

        ${cam.length ? `<h4>Cambios de producto recibidos</h4>
        <table>
          <tr>
            <th>Cliente</th>
            <th>Producto</th>
            <th>Cajas</th>
            <th>Bot.</th>
            <th>Motivo</th>
          </tr>
          ${cam.map(x => x.rows.map(r => `<tr>
            <td>${x.n}</td>
            <td>${CAT[r.k][0]}</td>
            <td>${+r.c || 0}</td>
            <td>${+r.b || 0}</td>
            <td>${r.m}</td>
          </tr>`).join('')).join('')}
        </table>` : ''}

        ${al.length ? `<h4>Altas de cliente enviadas al CDA y de ahí al SAP</h4>
        <p class="note">${al.join(', ')}: ya aparece como cliente nuevo en la lista.</p>` : ''}

        <h4>2. SAP genera las facturas (demo)</h4>
        <table>
          <tr>
            <th>N° comprobante</th>
            <th>Cliente</th>
            <th>Subtotal</th>
            <th>Promoción</th>
            <th>IGV 18 %</th>

          </tr>
          ${O.map(c => { const T = totR(c.ord.rows); return `<tr>
            <td>${c.fac}</td>

        </table>

        <h4>3. Orden de reparto para Logística (entrega de mañana)</h4>
        <p class="note">Ruta 104 · camión 1. Las paradas siguen el orden de la ruta.</p>
        <table>
          <tr>
            <th>Parada</th>
            <th>Cliente</th>
            <th>Dirección</th>
            <th>Productos</th>
            <th>Cajas</th>
            <th>Bot.</th>
          </tr>
          ${O.map((c, i) => { const T = totR(c.ord.rows); return `<tr>
            <td>${i + 1}</td>
            <td>${c.n}</td>
            <td>${c.dir}</td>
            <td>${det(c)}</td>
            <td>${T.c}</td>
            <td>${T.b}</td>

        <h4>4. Total a cargar y armado de pallets</h4>
        <table>
          <tr>

            <td>${prod[k].c}</td>
            <td>${prod[k].b}</td>

          <tr>
            <td><b>TOTAL</b></td>
            <td><b>${tc}</b></td>
            <td><b>${tb}</b></td>
          </tr>

        <p class="note">Pallets estimados: <b>${(tc / 48).toFixed(1)}</b> (supuesto de demostración: 48 cajas por pallet).</p>
      </div>`;

    // Anima los 5 nodos de la tubería, uno cada 0.7 s
    NODES.forEach((n, i) => cdaT.push(setTimeout(() => {

      d.classList.add('on');
      $('#cdaMsg').textContent = MSG[i];
      if (i === 4) $('#cdaBody').style.opacity = 1;

    el.scrollIntoView && el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  /* ══════════════════════════════════════════════════════════════════════
     SECCIÓN 11: SUITE DE PRUEBAS DE CALIDAD (27 CASOS)
     Cada prueba usa el simulador real y luego restaura la práctica.
     ══════════════════════════════════════════════════════════════════════ */

  function runQA() {
    // Guarda el estado de la práctica y del catálogo para restaurarlos al final
    const snap = JSON.stringify(S),
          ca = JSON.stringify(CAT),
          R = [],
          eq = (a, b) => Math.abs(a - b) < 0.005;

    // Registra un caso: ejecuta la función y guarda [id, tipo, caso, esperado, obtenido, ¿ok?]
    const t = (id, tp, nm, ex, fn) => {
      let g, ok;
      try {
        const r = fn();
        ok = Array.isArray(r) ? r[0] : r === true;
        g = Array.isArray(r) ? r[1] : (ok ? 'Cumple' : String(r));
      } catch (e) {
        ok = false;
        g = 'Error: ' + e.message;
      }
      R.push([id, tp, nm, ex, g, ok]);
    };

    // Recorre el flujo completo de un pedido para el cliente i con las filas dadas
    const pedido = (i, rows) => {
      init();
      A.login();
      A.clients();
      A.cli(i);
      A.trans();
      A.ped();
      S.rows = rows;
      A.ok();
      A.confirm();
    };

    // Pedido de prueba: 3 cajas del SKU 124
    const R3 = [{ k: '124', c: 3, b: 0 }];

    /* ── Unitarias (U1 a U7): cálculos y validaciones ── */
    t('U1', 'Unitaria', 'Importe de 3 cajas del SKU 124', '$115.50', () => {
      const v = rowImp({ k: '124', c: 3, b: 0 });
      return [eq(v, 115.5), fm(v)];
    });
    t('U2', 'Unitaria', 'Importe de 2 botellas del SKU 123 (24 por caja)', '$1.44', () => {
      const v = rowImp({ k: '123', c: 0, b: 2 });
      return [eq(v, 1.44), fm(v)];
    });
    t('U3', 'Unitaria', 'Sin promoción con 2 cajas; 12 % con 3 cajas', '$0.00 y $13.86', () => {
      S.rows = [{ k: '124', c: 2, b: 0 }];
      const a = totR().pr;
      S.rows = R3;
      const b = totR().pr;
      return [eq(a, 0) && eq(b, 13.86), fm(a) + ' y ' + fm(b)];
    });
    t('U4', 'Unitaria', 'IGV 18 % y total del pedido de 3 cajas', 'IGV $18.30, total $119.94', () => {
      S.rows = R3;
      const T = totR();
      return [eq(T.ig, 18.2952) && eq(T.t, 119.9352), 'IGV ' + fm(T.ig) + ', total ' + fm(T.t)];
    });
    t('U5', 'Unitaria', 'SKU inexistente es rechazado', 'Aviso "no existe"', () => {
      init();
      S.rows = [{ k: '999', c: 1, b: 0 }];
      A.ok();
      return [/no existe/.test(S.toast), S.toast];
    });
    t('U6', 'Unitaria', 'Pedido sin cajas ni botellas es rechazado', 'Aviso de cantidad mínima', () => {
      init();
      S.rows = [{ k: '123', c: '', b: '' }];
      A.ok();
      return [/cantidad/.test(S.toast), S.toast];
    });
    t('U7', 'Unitaria', 'Alta de cliente con DNI de 3 dígitos', 'Rechazada', () => {
      init();
      S.alta = { dni: '123', n: 'A', d: 'B', f: ['a', 'b'] };
      A.savealta();
      return [/DNI/.test(S.toast) && !S.altas.length, S.toast];
    });

    /* ── Integración (I1 a I9): recorridos completos de la app ── */
    // U8: la cuota mensual sale de 18 L × 41 visitas × 30 días
    t('U8', 'Unitaria', 'Cuota mensual: 18 L × 41 visitas × 30 días', '22 140 L', () => {
      return [CFG.cuotaMes === 22140, lt(CFG.cuotaMes)];
    });

    // U9: litros de 3 cajas del SKU 124 (9 botellas de 1 L por caja)
    t('U9', 'Unitaria', 'Litros de 3 cajas del SKU 124', '27 L', () => {
      const v = litrosDe([{ k: '124', c: 3, b: 0 }]);
      return [eq(v, 27), v.toFixed(1) + ' L'];
    });

    // U10: score diario y cumplimiento mensual al iniciar (6 visitadas de 41)
    t('U10', 'Unitaria', 'Score diario y cumplimiento mensual iniciales', 'Score 15 %, cumplimiento 32 %', () => {
      init();
      return [scoreDia() === 15 && cumplMes() === 32, 'Score ' + scoreDia() + ' %, cumplimiento ' + cumplMes() + ' %'];
    });

    t('I1', 'Integración', 'Login lleva al menú principal', 'Pantalla menu', () => {
      init();
      A.login();
      return [S.scr === 'menu', S.scr];
    });
    t('I2', 'Integración', 'Cliente abre su panel sin ventana intermedia', 'panel y sin diálogo', () => {
      init();
      A.login();
      A.clients();
      A.cli(6);
      return [S.scr === 'panel' && !S.dlg, S.scr + (S.dlg ? ' con diálogo' : '')];
    });
    t('I3', 'Integración', 'Pedido completo: resumen, confirmar y guardar', 'Cliente pendiente con pedido', () => {
      pedido(6, R3);
      return [S.C[6].st === 1 && S.C[6].ord.rows.length === 1 && S.scr === 'menu', 'estado ' + S.C[6].st + ', pantalla ' + S.scr];
    });
    t('I4', 'Integración', 'Enviar con internet marca el pedido como enviado', 'Estado 2 y factura', () => {
      pedido(6, R3);
      A.send();
      A.run();
      const m = S.mode;
      A.fin();
      return [m === 'x' && S.C[6].st === 2 && !!S.C[6].fac, 'estado ' + S.C[6].st + ', ' + S.C[6].fac];
    });
    t('I5', 'Integración', 'Sin cobertura: Enviar avisa y conserva el pedido', 'Aviso y pedido guardado', () => {
      pedido(7, R3);
      S.off = true;
      A.run();
      return [S.dlg && S.dlg.t === 'Sin conexión' && S.C[7].st === 1, (S.dlg ? S.dlg.t : 'sin aviso') + ', estado ' + S.C[7].st];
    });
    t('I6', 'Integración', 'Contingente con internet envía lo guardado', 'Estado 2', () => {
      pedido(7, R3);
      S.off = true;
      S.off = false;
      A.runcont();
      const m = S.mode;
      A.fin();
      return [m === 'cont' && S.C[7].st === 2, m + ', estado ' + S.C[7].st];
    });
    t('I7', 'Integración', 'Fin de Ruta cierra la ruta y exige sincronizar', 'Ruta cerrada', () => {
      init();
      A.login();
      A.runruta();
      A.fin();
      A.clients();
      return [S.closed && S.dlg && S.dlg.t === 'Ruta cerrada', 'cerrada=' + S.closed];
    });
    t('I8', 'Integración', 'Alta de cliente llega como NUEVO tras enviar', 'Cliente NUEVO', () => {
      init();
      A.login();
      A.alta();
      S.alta = { dni: '12345678', n: 'Ana Perez', d: 'Jr. Real 1', f: ['a.jpg', 'b.jpg'] };
      A.savealta();
      A.run();
      A.fin();
      return [!!S.C[0].nuevo && S.extra === 1, S.C[0].n + (S.C[0].nuevo ? ' NUEVO' : '')];
    });
    t('I9', 'Integración', 'Cambio de producto se guarda para enviar', '1 cambio pendiente', () => {
      init();
      A.login();
      A.clients();
      A.cli(8);
      A.trans();
      A.cambio();
      S.cr = [{ k: '125', c: 1, b: 0, m: 'Vencido' }];
      A.cok();
      const a = S.scr;
      A.cconfirm();
      return [a === 'cresumen' && S.cambios.length === 1, a + ', cambios ' + S.cambios.length];
    });

    /* ── Sistema (S1): flujo extremo a extremo con panel CDA ── */
    // I10: un pedido confirmado sube los litros y el porcentaje de la cuota
    t('I10', 'Integración', 'Un pedido de 40 cajas del SKU 124 suma 360 L a la cuota', '+360 L y % mayor', () => {
      init();
      const a = litrosMes(), pa = cuotaPct();
      pedido(8, [{ k: '124', c: 40, b: 0 }]);
      return [eq(litrosMes() - a, 360) && cuotaPct() > pa, '+' + Math.round(litrosMes() - a) + ' L, ' + pa + ' % → ' + cuotaPct() + ' %'];
    });

    t('S1', 'Sistema', 'Flujo completo: pedido, envío, CDA, factura y reparto', 'Cliente en factura y reparto', () => {
      pedido(9, [{ k: '126', c: 5, b: 0 }, { k: '127', c: 1, b: 0 }]);
      A.send();
      A.run();
      A.fin();
      const x = $('#cda').textContent;
      return [x.includes(S.C[9].n) && x.includes('F001-'), S.C[9].fac];
    });

    /* ── Usabilidad (X1, X2) ── */
    t('X1', 'Usabilidad', 'Tiempo de un pedido (meta PA1: 90 s)', '≤ 90 s', () => {
      const v = JSON.parse(snap).lastT;
      return v === undefined ? [true, 'No medido: haz un pedido y vuelve a ejecutar'] : [v <= 90, v.toFixed(1) + ' s'];
    });
    t('X2', 'Usabilidad', 'Campos numéricos escribibles, sin flechitas', 'inputmode numeric', () => {
      init();
      S.scr = 'ped';
      S.pg = 1;
      const h = V.ped();
      return [h.includes('inputmode="numeric"') && !h.includes('type="number"'), 'ok'];
    });

    /* ── Mantenibilidad (M1, M2) ── */
    t('M1', 'Mantenibilidad', 'Catálogo central completo', 'Todos con nombre y precio', () => [
      Object.values(CAT).every(p => p[0] && p[1] > 0 && p[2] > 0),
      Object.keys(CAT).length + ' SKU'
    ]);
    t('M2', 'Mantenibilidad', 'Cambiar un precio en un solo lugar cambia el total', '$20.00', () => {
      CAT[123][1] = 20;
      const v = rowImp({ k: '123', c: 1, b: 0 });
      Object.assign(CAT, JSON.parse(ca));
      return [eq(v, 20), fm(v)];
    });

    /* ── Eficiencia (E1) ── */
    t('E1', 'Eficiencia', 'Calcular totales de 2000 filas (meta: menos de 1.5 s)', '< 1500 ms', () => {
      S.rows = Array.from({ length: 2000 }, () => ({ k: '124', c: 2, b: 1 }));
      const t0 = performance.now();
      totR();
      const d = performance.now() - t0;
      return [d < 1500, d.toFixed(1) + ' ms'];
    });

    /* ── Portabilidad (P1) ── */
    t('P1', 'Portabilidad', 'Adaptable a pantallas de celular (meta viewport)', 'Etiqueta viewport', () => [
      !!document.querySelector('meta[name=viewport]'), 'ok'
    ]);

    // Resultado global y restauración de la práctica del usuario
    const okN = R.filter(r => r[5]).length;
    S = JSON.parse(snap);
    Object.assign(CAT, JSON.parse(ca));
    render();

    // Tabla de resultados en el panel #qa
    const q = $('#qa');
    q.style.display = 'block';
    q.innerHTML = `
      <h3>Pruebas de calidad</h3>
      <p><b class="${okN === R.length ? 'pas' : 'fal'}">${okN} de ${R.length} pruebas aprobadas</b> (${Math.round(okN / R.length * 100)} %). Cada prueba usa el simulador real y luego restaura tu práctica.</p>
      <table>
        <tr>
          <th>ID</th>
          <th>Tipo</th>
          <th>Caso de prueba</th>
          <th>Esperado</th>
          <th>Obtenido</th>
          <th>Estado</th>
        </tr>
        ${R.map(r => `<tr>
          <td>${r[0]}</td>
          <td>${r[1]}</td>
          <td>${r[2]}</td>
          <td>${r[3]}</td>
          <td>${r[4]}</td>
          <td class="${r[5] ? 'pas' : 'fal'}">${r[5] ? 'APROBADA' : 'FALLIDA'}</td>
        </tr>`).join('')}
      </table>`;
    q.scrollIntoView && q.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  /* ══════════════════════════════════════════════════════════════════════
     SECCIÓN 12: REGISTRO DE LA COMUNICACIÓN (Enviar · Fin de Ruta · Contingente)
     ══════════════════════════════════════════════════════════════════════ */

  // Simula la transmisión según el tipo: 'x' Enviar · 'ruta' Fin de Ruta ·
  // 'cont' Sincronismo Contingente. Sin cobertura guarda y avisa.
  function runlog(m) {
    if (S.off) {
      // Sin internet: el contingente avisa; los demás guardan en el equipo
      if (m === 'cont') {
        S.dlg = null;
        return toast('Aún sin cobertura. Inténtalo cuando recuperes internet.');
      }
      S.dlg = { k: 'c', t: 'Sin conexión', b: 'No hay cobertura. La información queda guardada en el equipo. Cuando recupere internet use Sincronismo Contingente.', btn: [['ACEPTAR', 'close']] };
      return render();
    }

    S.dlg = null;
    S.log = [];
    S.logOk = false;
    S.mode = m;
    go('log');

    // Líneas del registro, con extras según lo pendiente de enviar
    const L = [m === 'ruta' ? 'Enviando compras del día…' : m === 'cont' ? 'Enviando información guardada localmente…' : 'Procesando datos…', 'Conectando al servidor…'];
    if (S.altas.length) L.push('Enviando altas de clientes al CDA…', 'CDA → SAP: solicitud registrada');
    if (S.cambios.length) L.push('Enviando cambios de producto…');
    L.push('Información enviada correctamente', 'ArcaApi: Token obtenido', 'Actualizar pedidos enviados OK');
    if (m === 'ruta') L.push('Visita de ruta cerrada');

    // Pinta cada línea con medio segundo de separación; al final, OK
    L.forEach((l, i) => setTimeout(() => {
      if (S.scr === 'log') {
        S.log.push(l);
        render();
      }
    }, 500 * (i + 1)));
    setTimeout(() => {
      if (S.scr === 'log') {
        S.logOk = true;
        render();
      }
    }, 500 * (L.length + 1));
  }

  /* ══════════════════════════════════════════════════════════════════════
     SECCIÓN 13: ACCIONES DEL USUARIO (mapa data-a → función)
     Cada elemento de la pantalla lleva data-a="acción" y opcionalmente
     data-v="valor". Un único listener global las despacha (sección 14).
     ══════════════════════════════════════════════════════════════════════ */

  const A = {

    /* ── Navegación general ── */

    // Reinicia toda la práctica (estado de fábrica)
    reset: init,

    // Inicia sesión y va al menú principal
    login: () => { S.sync = false; go('menu'); },

    // Vuelve atrás; si hay un diálogo abierto, lo cierra
    back: () => {
      if (S.dlg) {
        S.dlg = null;
        render();
      } else if (S.scr !== 'log' && S.h.length) {
        S.scr = S.h.pop();
        render();
      }
    },

    // Vuelve al menú principal desde cualquier pantalla
    home: () => {
      if (S.scr !== 'login' && S.scr !== 'log') {
        S.dlg = null;
        S.h = ['login'];
        S.scr = 'menu';
        render();
      }
    },

    // Función no usada en la práctica: muestra un aviso informativo
    na: v => toast(v || 'Esta función no se usa en la práctica.'),

    // Abre "Tipo de comunicación"
    sync: () => go('sync'),

    /* ── Clientes ── */

    // Abre la lista de clientes; si la ruta está cerrada, avisa
    clients: () => {
      if (S.closed) {
        S.dlg = { k: 'c', t: 'Ruta cerrada', b: 'Ya se hizo Fin de Ruta. Debe sincronizar nuevamente para continuar con los clientes.', btn: [['CANCELAR', 'close'], ['SINCRONIZAR', 'gosync']] };
        render();
      } else go('clients');
    },

    // Desde el aviso "Ruta cerrada": ir a sincronizar
    gosync: () => { S.dlg = null; go('sync'); },

    // Abre el formulario de alta de cliente nuevo
    alta: () => { S.alta = { f: [] }; go('alta'); },

    // Entra al panel del cliente elegido (data-v = índice)
    cli: v => { S.cur = +v; go('panel'); },

    // Cierra el lector de código y confirma identificación
    scanok: () => { S.dlg = null; go('panel'); toast('Cliente identificado por código y GPS'); },

    // Abre la pantalla de motivo sin sticker
    nocode: () => { S.dlg = null; S.mot = null; go('motivo'); },

    // Marca el motivo elegido
    mot: v => { S.mot = v; render(); },

    // Guarda el motivo y regresa al panel del cliente
    savemot: () => {
      if (!S.mot) return toast('Elige un motivo primero');
      S.scr = S.h.pop();
      toast('Motivo guardado: ' + S.mot);
    },

    // Abre las transacciones del cliente
    trans: () => go('trans'),

    // Consulta Pedidos Digitales (app Tu Aliado)
    dig: () => {
      S.dlg = { k: 'x', t: 'Aviso', b: 'Actualizando pedidos bajo demanda…' };
      render();
      setTimeout(() => { S.dlg = null; toast('Sin pedidos digitales nuevos'); }, 1400);
    },

    // Registra No Pedido o No Visita (data-v = mensaje)
    nop: v => {
      S.C[S.cur].st = -1;
      S.h = ['login', 'menu'];
      S.scr = 'clients';
      toast(v);
    },

    /* ── Pedido ── */

    // Inicia un pedido: cronómetro, fila vacía y promociones
    ped: () => {
      S.t0 = Date.now();
      S.rows = [{ k: '', c: '', b: '' }];
      S.pg = 0;
      S.psel = 0;
      go('ped');
      S.dlg = { k: 'promo' };
      render();
    },

    // Abre el diálogo de promociones del cliente
    promo: () => { S.dlg = { k: 'promo' }; render(); },

    // Selecciona la promoción a detallar
    psel: v => { S.psel = +v; render(); },

    // Cierra el diálogo actual
    close: () => { S.dlg = null; render(); },

    // Cambia de página con los puntos (saldos ↔ levantamiento)
    pg: v => { S.pg = +v; render(); },

    // Agrega una fila de producto al pedido
    add: () => {
      S.rows.push({ k: '', c: '', b: '' });
      render();
      setTimeout(() => { const e = $('#k' + (S.rows.length - 1)); e && e.focus(); }, 30);
    },

    // Elimina una fila del pedido
    del: v => {
      S.rows.splice(+v, 1);
      if (!S.rows.length) S.rows.push({ k: '', c: '', b: '' });
      render();
    },

    // Valida las filas (SKU y cantidades) y va al resumen
    ok: () => {
      const L = S.rows.filter(r => r.k || r.c || r.b);
      if (!L.length) return toast('Agregue al menos un producto');
      for (const r of L) {
        if (!CAT[r.k]) return toast('El SKU ' + (r.k || 'vacío') + ' no existe. Prueba 123 a 128');
        if ((+r.c || 0) <= 0 && (+r.b || 0) <= 0) return toast('Debe existir una cantidad en cajas o botellas como mínimo.');
      }
      go('resumen');
    },

    // Confirma el pedido, mide el tiempo y vuelve a la ruta
    confirm: () => {
      S.lastT = (Date.now() - (S.t0 || Date.now())) / 1000;
      S.C[S.cur].ord = { rows: S.rows.filter(r => r.k).map(r => ({ k: r.k, c: +r.c || 0, b: +r.b || 0 })) };
      S.C[S.cur].st = 1;
      S.h = ['login'];
      S.scr = 'menu';
      toast('Pedido confirmado. Ahora Sincronizar › Enviar.');
    },

    /* ── Alta de cliente ── */

    // Valida el DNI, nombre, dirección y documentos; guarda
    savealta: () => {
      const a = S.alta;
      if (!/^\d{8}$/.test(a.dni || '')) return toast('El DNI debe tener 8 dígitos');
      if (!(a.n || '').trim()) return toast('Falta nombres y apellidos');
      if (!(a.d || '').trim()) return toast('Falta la dirección de la tienda');
      if (!a.f[0] || !a.f[1]) return toast('Adjunta el recibo de luz o agua y la foto del DNI');
      S.altas.push({ n: a.n.trim().toUpperCase() });
      S.h.pop();
      S.scr = 'clients';
      toast('Solicitud guardada. Se envía al CDA al sincronizar.');
    },

    /* ── Comunicación (Enviar · Fin de Ruta · Contingente) ── */

    // Diálogo de confirmación del Fin de Ruta
    finq: () => {
      S.dlg = { k: 'c', t: 'Fin de Ruta', b: 'Se enviarán las compras del día y se cerrará la ruta. ¿Desea continuar?', btn: [['CANCELAR', 'close'], ['ACEPTAR', 'runruta']] };
      render();
    },

    // Ejecuta la comunicación de Fin de Ruta
    runruta: () => runlog('ruta'),

    // Simula o recupera la cobertura de internet
    off: () => {
      S.off = !S.off;
      toast(S.off ? 'Sin cobertura: todo se guarda en el equipo' : 'Internet recuperado: usa Sincronismo Contingente');
    },

    // Diálogo de confirmación del Sincronismo Contingente
    cont: () => {
      S.dlg = { k: 'c', t: 'Sincronismo Contingente', b: 'Se enviará todo lo guardado en el equipo. ¿Desea continuar?', btn: [['CANCELAR', 'close'], ['ACEPTAR', 'runcont']] };
      render();
    },

    // Ejecuta la comunicación contingente
    runcont: () => runlog('cont'),

    // Muestra las promociones vigentes de la ruta
    promos: () => go('promos'),

    // Abre las prioridades de marketing (ICE)
    ice: () => go('ice'),

    // Abre la lista de saldos (créditos) de los clientes
    saldos: () => go('saldos'),

    // Abre el resumen del día (bodegas y litros por marca)
    resdia: () => go('resdia'),

    // Abre el resumen mensual (bodegas y litros acumulados)
    resmes: () => go('resmes'),

    // Abre el detalle de cumplimiento mensual
    cump: () => go('cump'),

    // Abre el inventario de equipo frío
    frio: () => go('frio'),

    // Diálogo "¿Desea realizar esta operación?" al Enviar
    send: () => {
      S.dlg = { k: 'c', t: 'AC Móvil', b: '¿Desea realizar esta operación?', btn: [['CANCELAR', 'close'], ['ACEPTAR', 'run']] };
      render();
    },

    // Ejecuta la comunicación de Enviar
    run: () => runlog('x'),

    // Cierra el envío: aplica estados, alta de clientes y muestra el CDA
    fin: () => {
      const nw = S.C.filter(c => c.st === 1).map(c => c.n),
            cam = S.cambios,
            al = S.altas.map(a => a.n);
      S.C.forEach(c => { if (c.st === 1) c.st = 2 });
      const nn = S.altas.length;
      S.cambios = [];
      S.altas.forEach(a => {
        S.C.unshift({ n: a.n, t: 'CLIENTE NUEVO', st: 0, nuevo: true });
        S.extra++;
      });
      S.altas = [];
      showCda(nw, cam, al);
      if (S.mode === 'ruta') {
        S.closed = true;
        S.h = ['login'];
        S.scr = 'menu';
        toast('Ruta cerrada. Para continuar debes sincronizar de nuevo.');
      } else {
        S.closed = false;
        S.sync = true;
        S.h = ['login', 'menu'];
        S.scr = 'clients';
        toast(nn ? 'Enviado. El cliente nuevo ya aparece en la lista.' : 'Enviado. Pasa al siguiente cliente.');
      }
    },

    /* ── Cambio de producto ── */

    // Inicia un cambio de producto con una fila vacía
    cambio: () => { S.cr = [{ k: '', c: '', b: '', m: 'Merma' }]; go('cambio'); },

    // Agrega una fila al cambio de producto
    cadd: () => {
      S.cr.push({ k: '', c: '', b: '', m: 'Merma' });
      render();
      setTimeout(() => { const e = $('#ck' + (S.cr.length - 1)); e && e.focus(); }, 30);
    },

    // Elimina una fila del cambio de producto
    cdel: v => {
      S.cr.splice(+v, 1);
      if (!S.cr.length) S.cr.push({ k: '', c: '', b: '', m: 'Merma' });
      render();
    },

    // Valida las filas del cambio y va a su resumen
    cok: () => {
      const L = S.cr.filter(r => r.k || r.c || r.b);
      if (!L.length) return toast('Agregue al menos un producto');
      for (const r of L) {
        if (!CAT[r.k]) return toast('El SKU ' + (r.k || 'vacío') + ' no existe. Prueba 123 a 128');
        if ((+r.c || 0) <= 0 && (+r.b || 0) <= 0) return toast('Debe existir una cantidad en cajas o botellas como mínimo.');
      }
      go('cresumen');
    },

    // Confirma el cambio: queda pendiente para el envío
    cconfirm: () => {
      S.cambios.push({ n: S.C[S.cur].n, rows: S.cr.filter(r => r.k) });
      S.h = ['login'];
      S.scr = 'menu';
      toast('Cambio de producto guardado. Se envía al sincronizar.');
    },

    /* ── Pruebas de calidad ── */

    // Ejecuta la suite de 23 pruebas de calidad
    qa: () => runQA()
  };

  /* ══════════════════════════════════════════════════════════════════════
     SECCIÓN 14: ARRANQUE: DELEGACIÓN DE CLICS Y PRIMERA RENDERIZACIÓN
     ══════════════════════════════════════════════════════════════════════ */

  // Un solo listener: cualquier clic en un elemento con data-a ejecuta
  // la acción A[data-a] pasándole data-v como valor.
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]');
    if (el && A[el.dataset.a]) A[el.dataset.a](el.dataset.v);
  });

  // Primera renderización de la práctica
  init();
  </script>
</body>
</html>
